flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: '#111111'
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_foreground_inset: 12
  remove_alpha_ios: true
  min_sdk_android: 24
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: '#FFFFFF'
    theme_color: '#C8201A'
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/app_icon.png
